# Render Blueprint for LandslideSOS
# Deploys: managed Postgres + the FastAPI backend (web) + a one-time
# migrate/seed job. See DEPLOY.md -> "Hosting on Render".
#
# Defaults are demo-safe: SMS/IMD/DEM providers run in SIMULATION mode,
# Celery runs eager (no worker needed), CORS allows the Vercel SPA.
services:
  - type: web
    name: landslidesos-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/v1/system/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: landslidesos-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: CORS_ALLOW_ALL
        value: "false"
      - key: CORS_ORIGINS
        value: '["http://localhost:5173","http://127.0.0.1:5173","https://landslide-sos.vercel.app"]'
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"
      - key: CELERY_BROKER_URL
        value: "memory://"
      - key: CELERY_RESULT_BACKEND
        value: "cache+memory://"
      - key: SMS_PROVIDER
        value: "msg91"
      - key: MSG91_AUTH_KEY
        value: ""
      - key: IMD_API_KEY
        value: ""
      - key: OPENTOPOGRAPHY_API_KEY
        value: ""

  - type: job
    name: landslidesos-migrate-seed
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: landslidesos-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: CORS_ALLOW_ALL
        value: "false"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"
      - key: CELERY_BROKER_URL
        value: "memory://"
      - key: CELERY_RESULT_BACKEND
        value: "cache+memory://"
    command:
      - python -m alembic upgrade head
      - python scripts/seed_data.py
      - python scripts/seed_demo_risk.py --reset-alerts --reset-reports

databases:
  - name: landslidesos-db
    plan: free