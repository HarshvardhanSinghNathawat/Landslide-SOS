name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check backend/app backend/scripts
      - run: ruff format --check backend/app backend/scripts

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - working-directory: backend
        run: pip install -r requirements.txt
      - working-directory: backend
        run: |
          python -m pytest -q
          python scripts/seed_data.py
          python scripts/load_inventory.py
          python scripts/compute_swi.py
          python scripts/train_model.py --no-score
      - working-directory: backend
        env:
          ENVIRONMENT: test
          DEBUG: "true"
          AUTO_CREATE_TABLES: "true"
        run: |
          python -m uvicorn app.main:app --port 8000 &
          sleep 5
          python tests/smoke_test.py

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: landslidesos/backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
